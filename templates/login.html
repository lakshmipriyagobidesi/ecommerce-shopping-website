{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap"><form class="form-card" method="post"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Sign in to continue shopping.</p>
<label>Email address<input type="email" name="email" required autocomplete="email" value="{{ request.form.get('email','') }}"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="button button-full" type="submit">Log in</button><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></div>
{% endblock %}
