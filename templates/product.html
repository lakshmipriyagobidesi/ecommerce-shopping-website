{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<div class="detail-layout">
  <div class="detail-image"><img src="{{ product.image }}" alt="{{ product.name }}" onerror="this.src='https://placehold.co/700x600?text=Product'"></div>
  <div class="detail-copy">
    <a class="back-link" href="{{ url_for('index') }}">← Back to shopping</a>
    <span class="category-pill">{{ product.category }}</span>
    <h1>{{ product.name }}</h1><p class="detail-description">{{ product.description }}</p>
    <div class="detail-price">₹{{ '%.2f'|format(product.price) }}</div>
    <p class="stock">{{ product.stock }} available</p>
    <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="post"><button class="button" type="submit" {% if product.stock <= 0 %}disabled{% endif %}>Add to cart</button></form>
  </div>
</div>
{% endblock %}
